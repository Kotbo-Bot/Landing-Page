name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Une page fonctionnalité publiée ou modifiée depuis dash.kotbo.fr
  # (`/admin/feature-pages`) : le bot envoie ce signal pour que le site la
  # reprenne (featurePageService.ts, LANDING_DEPLOY_TOKEN).
  repository_dispatch:
    types: [feature-pages]
  # Filet de sécurité si le signal se perd : une reconstruction par jour.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      # kotbo.fr/docs : les docs (Kotbo-Bot/kotdocs) sont construites ici, GitHub
      # Pages ne pouvant pas servir deux dépôts sur un même domaine.
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          repository: Kotbo-Bot/kotdocs
          path: _docs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build docs
        working-directory: _docs
        run: bun install --frozen-lockfile && bun run build

      - name: Merge docs into site
        run: mkdir -p build/docs && cp -r _docs/dist/. build/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
